; Console Zombie prototype tuning. Values are loaded at startup.
player_walk_speed = 2.0
player_run_speed = 2.8
player_rotation_speed = 3.5
roll_speed = 7.0
roll_duration = 0.24
roll_cooldown = 0.5

; 사격 반동. 총알이 실제로 나갔을 때만 돈다 — 탄약이 없어 거부된 방아쇠는
; 반동도 없다. kick 은 프레임 높이 대비 비율이라 무기 스프라이트와 같은 단위로
; 움직인다. 창 크기가 바뀌어도 같은 몫만큼 밀린다.
weapon_recoil_duration = 0.2
weapon_recoil_kick = 0.05

; 조준 흔들림. 기획 7장의 값이고 단위는 120x80 논리 화면 기준 픽셀이다.
; 실제로는 frameHeight / 80 을 곱해 쓰므로 창이 커져도 같은 몫만큼 흔들린다.
; 난수를 쓰지 않는다 — 시간 기반 곡선이라 같은 입력이 같은 결과를 낸다.
; 총알은 언제나 화면에 보이는 그 조준점으로 나간다. 숨겨진 탄 퍼짐이 아니다.
aim_sway_walk_pixels = 1.0
aim_sway_run_pixels = 2.0
aim_sway_roll_pixels = 3.0
aim_sway_settle = 0.2
; 사격 후 조준점이 튀는 양. 무기 반동과 같은 타이머로 돌아온다.
aim_kick_up_pixels = 2.0
aim_kick_side_pixels = 1.0

; 피격 시 화면 가장자리가 붉어진다. 전체 균일 틴트가 아니라 비네트다 —
; 맞고 있는 순간이야말로 크로스헤어를 봐야 하는데 화면 전체를 덮으면
; 반격이 불가능해진다. strength 는 모서리에서의 최대 혼합 비율이다.
hit_flash_duration = 0.4
hit_flash_strength = 0.55

; 소리. audio_enabled = 0 이면 장치를 아예 열지 않고 나머지는 그대로 돈다.
; World 큐(문 두드림, 파손, 좀비 그르렁)는 유클리드 거리가 아니라
; Grid::AcousticCost 음향 필드로 감쇠한다. 좀비가 듣는 방식과 같은 필드다.
; 그래서 벽 하나를 사이에 두면 벽으로 들린다.
;   볼륨 = max(0, 1 - 음향경로비용 / audio_hearing_cost)
; bgm 은 상시 재생이라 효과음보다 확실히 낮게 둔다.
audio_enabled = 1
master_volume = 0.8
sfx_volume = 0.8
bgm_volume = 0.5
audio_hearing_cost = 40
zombie_speed = 2.1
zombie_awareness_range = 5.0
zombie_repath_interval = 0.35
zombie_attack_interval = 0.9
; How often an alert zombie growls again. It never loses interest, so it never
; goes quiet.
zombie_growl_interval = 4.0
; How far a zombie walks in one full stride, and how long a body takes to fall.
zombie_stride_tiles = 0.9
zombie_death_duration = 0.45

; Running is a resource. stamina_max is in seconds of running, so 7 with a drain
; of 1 is seven seconds flat out. A roll costs 2.5, a bit over a third of the bar,
; and recovery starts stamina_regen_delay seconds after the last use.
stamina_max = 8
stamina_run_drain = 1.0
stamina_roll_cost = 2.5
stamina_regen = 1.0
stamina_regen_delay = 1.0

; Breach pressure thresholds. A crack never heals; only a warning can lift.
; Lowered with the noise amounts below: sound carries far less now, so the pressure
; it delivers is smaller and the thresholds move with it.
breach_warning_pressure = 12
breach_crack_pressure = 24
breach_break_pressure = 40
breach_pressure_decay = 3
breach_decay_delay = 3
breach_existing_pressure_weight = 0.02
; A zombie that has heard you leans on its own breach until it gives way. At 3 a
; single one needs about thirteen seconds, four of them about three.
breach_zombie_pressure_per_second = 3
breach_max_responders = 1

; Sound travels as a Dijkstra cost field over the grid: floor 1, closed door 3,
; intact window 4, wall 6. Effective noise = max(0, amount - path cost * falloff),
; and the chosen breach gains effective noise * scale in pressure.
noise_acoustic_falloff = 1.5
noise_pressure_scale = 0.5

; Per action loudness and the chance the map reacts to that event at all.
;
; A noise reaches acoustic path cost amount / noise_acoustic_falloff. At 1.5 a shot
; of 30 carries twenty tiles of open floor, about one room and the corridor to the
; next. Zombies hear on the same field, so raising these widens who comes running.
walk_noise = 3
walk_reaction_chance = 0.05
walk_noise_interval = 0.55
run_noise = 10
run_reaction_chance = 0.25
run_noise_interval = 0.40
roll_noise = 12
roll_reaction_chance = 0.40
door_noise = 7
door_reaction_chance = 0.20
shot_noise = 30
shot_reaction_chance = 1.00

; The frame is fitted to the terminal viewport for a 1:1 pixel mapping. These are
; the machine-independent ceiling on that: past this size the same frame is scaled
; up to fill the window instead of being rendered larger, so a QHD monitor costs
; what a laptop costs. Lower them to trade sharpness for raycast time.
render_max_width = 360
render_max_height = 200

; Ceiling on the terminal cells one frame may occupy, 0 for the whole window.
; Cells are what output really costs: bytes written and glyphs the host has to draw
; both scale with them and neither cares about render_max_*. Filling a maximised QHD
; window is about 73,000 cells and 290KB a frame, which holds 30 FPS with room to
; spare. Set these only if you want more than that; the frame is then centred and
; the margin left black, and the margin is painted once rather than every frame.
present_max_columns = 0
present_max_rows = 0

; Em height of the HUD text in frame pixels, 0 to derive it from the frame
; (frame height / 18, floored at 9 and capped at 16). The text is baked from a
; Windows font, so it scales with the render resolution rather than with whatever
; size the terminal's own font happens to be.
ui_text_height = 0

; Console cell height in pixels, applied at startup. 0 leaves the font alone, which
; is the default. Windows Terminal ignores this entirely and uses the font from its
; own profile, so use Config/WindowsTerminalProfile.json there. conhost does honour
; it, but resizing the cell mid-session has disturbed mouse mapping before, so turn
; it on only to experiment.
terminal_font_height = 0

; The key must sit at least this much A* path cost away from the exit. A seed
; whose deepest qualifying room is cheaper than this is discarded and rerolled,
; up to 100 times. Raise it for longer runs; too high and generation gives up.
minimum_key_path_cost = 40

; 좀비 열둘이 밸런스 기준선이다. 감염 공간 두 곳에 셋씩 자고, 나머지 여섯이
; 시작 방과 빈 방 하나를 뺀 방들에 1~2마리씩 흩어진다. 값은 10..14로 잘린다.
; (2026-08-27 플레이 테스트 전에는 감염 5+5 · 밖에 2였는데 너무 조용했다.)
;
; 추가 탄약은 두 뭉치로 나뉜다 — 1발과 나머지 전부. 지금 값이면 1발과 3발이고,
; 둘 다 시작에서 열쇠까지의 필수 동선 밖에 놓인다. 그게 탄약 획득을 선택 사항으로
; 만드는 유일한 장치다.
zombie_count = 12
extra_ammo_rounds = 4

start_ammo = 4
player_health = 4
; 30에서 60으로 올렸다(2026-08-27). QHD 최대화에서 우리 코드가 쓰는 시간은 한 프레임에
; 3.41ms라 16.6ms 예산에 넉넉히 들어간다. 남은 제약은 터미널이 삼키는 속도로, 실측 약
; 16.8MB/s에 60FPS x 295KB = 17.7MB/s라 창을 꽉 채우면 아슬아슬하다. 프레임이 60에 못
; 미치면 present_max_columns/rows를 켜서 셀을 줄여라. 10..60으로 잘린다.
render_fps = 60

; How long a status line stays on screen, and how long the same line refuses to
; repeat. Footsteps fire twice a second, so without the cooldown the log would be
; nothing but knocking.
ui_log_seconds = 4
ui_log_cooldown = 3
